<p-splitter [panelSizes]="[45, 55]" [style]="{ height: '100%' }" panelStyleClass="panels">
    <ng-template #panel>
        <div class="tablebox block p-3">
            <h3>Databases:</h3>
            <p-table #dbtable id="databases" [value]="databases" selectionMode="single" [(selection)]="selectedDatabase" dataKey="id" 
                        (onRowSelect)="onRowSelect($event)" (onRowUnselect)="onRowUnselect($event)" 
                        styleClass="p-datatable-striped" [tableStyle]="{ 'min-width': '30rem' }">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Name</th>
                        <th>Notes</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-database>
                    <tr [pSelectableRow]="database">
                        <td>{{database.ds.name}}</td>
                        <td>{{database.notes}}</td>
                    </tr>
                </ng-template>
            </p-table>
            
            <div class="mt-3">
                <p-button icon="pi pi-sync" (click)="getDatabases()" tooltipPosition="top" pTooltip="Reload"></p-button>&nbsp;
                <p-button icon="pi pi-plus" (click)="addDatabase()" tooltipPosition="top" pTooltip="Add"></p-button>&nbsp;
            </div>

            <div class="card m-5">
                @for (message of messages(); track message; ) {
                    <p-message [severity]="message.severity" [text]="message.text" [closable]="true"/>
                }
            </div>
        </div>
    </ng-template>

    <ng-template #panel>
        <div class="w-100 p-3" *ngIf="adding" style="z-index: 100;">
            <h3 class="new-title">New Database</h3>
            <div class="p-2">
                <label for="name">Name:</label>
                <input type="text" pInputText id="name" [(ngModel)]="name"/>
            </div>
            <div class="p-2">
                <label for="path">Import Path:</label>
                <input type="text" pInputText id="path" [(ngModel)]="path"/> &nbsp; <p-button icon="pi pi-file" (click)="selectFile()" tooltipPosition="top" pTooltip="Select File"></p-button>
            </div>
            <div class="p-2">
                <label for="notes">Notes:</label>
                <textarea rows="5" cols="80" pInputTextarea [(ngModel)]="notes"></textarea>
            </div>
            <div class="p-2">
                <p-button (click)="save()">Save</p-button>&nbsp;
                <p-button (click)="saveAndImport()">Save and Import</p-button>&nbsp;
                <p-button severity="warn" (click)="cancel()">Cancel</p-button>&nbsp;
            </div>
        </div>

        <div class="w-100 p-3" *ngIf="updating" style="z-index: 100;">
            <h3 class="update-title"> Update Database </h3>
            <div class="p-2">
                <label for="name">Name:</label>
                <input type="text" pInputText id="name" [(ngModel)]="name"/>
            </div>
            <div class="p-2">
                <label for="path">Import Path:</label>
                <input type="text" pInputText id="path" [(ngModel)]="path"/> &nbsp; <p-button icon="pi pi-file" (click)="selectFile()" tooltipPosition="top" pTooltip="Select File"></p-button>
            </div>
            <div class="p-2">
                <label for="notes">Notes:</label>
                <textarea rows="5" cols="80" id="notes" pInputTextarea [(ngModel)]="notes"></textarea>
            </div>
            <div class="p-2">
                <p-button severity="success" (click)="update()">Update</p-button>&nbsp;
                <p-button *ngIf="!doesDatabaseExists()" (click)="import()">Import Games</p-button>&nbsp;
                <p-button severity="danger" (click)="delete()">Delete</p-button>&nbsp;
            </div>
        </div>

        <div class="box" *ngIf="adding === false && updating === false">
            <div class="box flex align-items-center justify-content-center">
                Please Select a Database.
            </div>
        </div>
    </ng-template>
</p-splitter>

<p-dialog class="p-5" header="Select File" [modal]="true" [(visible)]="visible" [style]="{ width: '50rem', overflow: 'hidden' }">
    <fileSelection [root]="dbroot" (selectedFile)="setSelectedFile($event)"></fileSelection>
</p-dialog>
