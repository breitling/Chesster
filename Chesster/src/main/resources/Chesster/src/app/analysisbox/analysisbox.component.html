<h3 class="new-title">Game Analysis</h3>
<div class="flex">
    <div style="z-index: 100;">
        <div class="p-2">
            <p-button severity="info" (click)="review()">Analyze</p-button> &nbsp;
            <p-button severity="danger" (click)="abortReview()" *ngIf="doingReview">Abort</p-button> &nbsp;
            <p-select [options]="depths" [(ngModel)]="selectedDepth" optionLabel="name" placeholder="Select Analysis Level"></p-select>
        </div>
        <div class="flex-row w-100 p-2" *ngIf="doingReview">
            <p-toast/>
            <p-progressbar [value]="progress"/>
        </div>
        <hr><br>
        <div class="flex-row m-1">
            <p-contextMenu #analysiscm [model]="analysisItems" [baseZIndex]="1000"/>
            <p-table id="review" stripedRows [scrollable]="true" scrollHeight="644px" [value]="reviewAnalysis" *ngIf="reviewAnalysis.length > 0"
                                     [(contextMenuSelection)]="selectedAnalysis" [contextMenu]="analysiscm" [style]="{'border': '1px solid black'}"
                                     [tableStyle]="{ 'max-width': '64.5rem' }">
                <ng-template #header>
                    <tr>
                        <th>&nbsp;</th>
                        <th>Move</th>
                        <th>Score</th>
                        <th>Best Continuation</th>
                    </tr>
                </ng-template>
                <ng-template #body let-a>
                    <tr>
                        <td>{{a.turn}}</td>
                        <td>{{a.move}}</td>
                        <td>{{a.score}}</td>
                        <td [pContextMenuRow]="{'move': a, 'index': a.number}">{{a.moveList}}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
        <div class="flex flex-row m-2">
            @for (message of messages(); track message; ) {
                <p-message [severity]="message.severity" [text]="message.text" [closable]="true"/>
            }
        </div>
    </div>
</div>
